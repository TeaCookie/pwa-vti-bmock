<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a35"/>
      <stop offset="100%" style="stop-color:#0d0d1a"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded rect -->
  <rect x="16" y="16" width="480" height="480" rx="64" fill="url(#bgGradient)"/>

  <!-- Three lights container -->
  <g transform="translate(256, 256)">
    <!-- Blue Light (split) - Left half -->
    <rect x="-160" y="-100" width="72" height="180" rx="16" fill="#007bff" filter="url(#glow)" opacity="0.9"/>
    <!-- Blue Light - Right half -->
    <rect x="88" y="-100" width="72" height="180" rx="16" fill="#00d4ff" filter="url(#glow)" opacity="0.9"/>

    <!-- Yellow Light -->
    <rect x="-36" y="-100" width="72" height="180" rx="16" fill="#ffd700" filter="url(#glow)" opacity="0.9"/>

    <!-- Red Light -->
    <rect x="88" y="20" width="72" height="180" rx="16" fill="#ff3333" filter="url(#glow)" opacity="0.9"/>
  </g>

  <!-- Subtle glass highlight overlay -->
  <rect x="16" y="16" width="480" height="200" rx="64" fill="rgba(255,255,255,0.05)"/>
</svg>