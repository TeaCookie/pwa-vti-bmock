# Netlify Configuration for Indicator Lights PWA

[build]
  # No build command needed for vanilla HTML/JS
  command = "echo 'No build step required'"
  publish = "."

[[headers]]
  # Service Worker - no caching, must be fresh
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

[[headers]]
  # Manifest - cache for a day
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400"

[[headers]]
  # Static assets - long term caching
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  # CSS/JS - cache with revalidation
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=86400, must-revalidate"

[[headers]]
  # HTML - no cache, always fresh
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  # Security headers
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()"

# Redirect trailing slashes
[[redirects]]
  from = "/*/"
  to = "/:splat"
  status = 301

# SPA fallback (not needed for this simple app, but good practice)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  conditions = {Role = [":any"]}