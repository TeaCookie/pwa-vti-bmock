name: Node.js tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Run Node test suite
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run tests
        run: node --test needle/test/*.test.mjs
